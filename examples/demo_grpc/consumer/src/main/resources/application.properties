quarkus.http.port=8080

quarkus.grpc.clients.items.host=localhost
quarkus.grpc.clients.items.port=9000

# This app only holds a gRPC client, no @GrpcService. Without this, Quarkus's
# gRPC Dev UI support force-starts a local gRPC server in dev mode on the same
# default port the producer uses, causing a bind conflict when both apps run
# side by side in dev mode.
quarkus.grpc.dev-mode.force-server-start=false
