quarkus.http.port=8081

quarkus.grpc.server.use-separate-server=true
quarkus.grpc.server.port=9000

# Datasource configuration - Dev Services will automatically start a PostgreSQL container
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=true

# Hibernate ORM configuration. Production schema changes should be handled by
# an explicit migration process rather than destroying existing data at startup.
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%prod.quarkus.hibernate-orm.schema-management.strategy=none
